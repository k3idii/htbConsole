[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htbconsole"
version = "0.3.0"
description = "Terminal UI for the Hack The Box platform and CTF competitions, built with Textual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "k3idii", email = "keidii@gmail.com" }]
keywords = ["hackthebox", "htb", "ctf", "tui", "textual", "security", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Terminals",
]
dependencies = [
    "httpx",
    "textual",
    "jinja2",
    "pyyaml",
    "rich",
]

[project.urls]
Homepage = "https://github.com/k3idii/htbConsole"
Repository = "https://github.com/k3idii/htbConsole"
Issues = "https://github.com/k3idii/htbConsole/issues"

[project.scripts]
htbconsole = "htbconsole.__main__:main"
tui-htb = "htbconsole.tuiHTB:main"
tui-ctf = "htbconsole.tuiCTF:main"

[tool.setuptools]
packages = ["htbconsole", "htbconsole.tuiComponents"]

[tool.setuptools.package-data]
htbconsole = ["*.tcss"]
